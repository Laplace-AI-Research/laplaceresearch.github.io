<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" width="640" height="246" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#23262d">
<title id="t">Oracle experiment lineage</title><desc id="d">Synthetic laws from three training families feed exact teacher demonstrations, which train three supervised models Oracle Lyra (seed 173), Oracle Aquila (seed 271), Oracle Cygnus (seed 389). Each has one RL descendant: Oracle Vega from Oracle Lyra, Oracle Altair from Oracle Aquila, Oracle Deneb from Oracle Cygnus. All arms are evaluated on the same held-out worlds and budgets: 384 IID worlds and 452 structural-holdout worlds using XOR and switch mechanisms that never appear in training.</desc>
