<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#23262d">
<title id="t">Recorded forecasts before and after a forced duplicate reading</title><desc id="d">Recorded single responses on the fixed copy-sensor history. Inkling 2 Mini: action after A+ bought b, forecast after A+ 80.0%, after forced A+ and B+ 80.0%; Oracle Lyra: action after A+ stopped, forecast after A+ 66.7%, after forced A+ and B+ 88.9%; Oracle Vega: action after A+ stopped, forecast after A+ 71.4%, after forced A+ and B+ 88.9%; Oracle Aquila: action after A+ stopped, forecast after A+ 80.0%, after forced A+ and B+ 90.5%; Oracle Altair: action after A+ stopped, forecast after A+ 66.7%, after forced A+ and B+ 80.0%; Oracle Cygnus: action after A+ stopped, forecast after A+ 72.7%, after forced A+ and B+ 94.1%; Oracle Deneb: action after A+ stopped, forecast after A+ 80.0%, after forced A+ and B+ 94.1%. Exact posterior 80% in both conditions.</desc>
