<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#23262d">
<title id="t">Same sensor versus independent sensors: exact probabilities</title><desc id="d">Two wiring diagrams with both displays positive. Same sensor: one physical sensor A feeds display A and display B; exact probability after A+ is 80% and after A+ and the copy is still 80%. Independent sensors: sensor A feeds display A and a separate sensor B feeds display B; exact probability after A+ is 80% and after A+ and B+ is 16/17, 94.1%. Generative law and exact calculation only; no model behavior.</desc>
<rect width="640" height="324" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#23262d"/></marker></defs>
<line x1="320.0" y1="20.0" x2="320.0" y2="300.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#23262d" font-weight="600">Same sensor</text>
<text x="20.0" y="48.0" font-size="12" text-anchor="start" fill="#5d626b">Display B copies sensor A</text>
<rect x="20.0" y="108.0" width="66.0" height="48.0" fill="#e8edf7" stroke="#02338a" stroke-width="1.2"/>
<text x="53.0" y="128.0" font-size="10.5" text-anchor="middle" fill="#02338a" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SIGNAL</text>
<text x="53.0" y="146.0" font-size="12" text-anchor="middle" fill="#23262d">on or off</text>
<rect x="104.0" y="108.0" width="88.0" height="48.0" fill="#fff" stroke="#23262d" stroke-width="1.6"/>
<text x="148.0" y="128.0" font-size="10.5" text-anchor="middle" fill="#23262d" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SENSOR A</text>
<text x="148.0" y="145.0" font-size="12" text-anchor="middle" fill="#5d626b">80% accurate</text>
<path d="M86 132.0 C95.0 132.0 95.0 132 102 132" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="224.0" y="74.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="264.0" y="93.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY A</text>
<text x="264.0" y="112.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M192 132 C208.0 132 208.0 98 222 98" fill="none" stroke="#02338a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="224.0" y="152.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="264.0" y="171.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY B</text>
<text x="264.0" y="190.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M192 132 C208.0 132 208.0 176 222 176" fill="none" stroke="#02338a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="264.0" y="136.0" font-size="11" text-anchor="middle" fill="#02338a">one wire, two ends</text>
<line x1="20.0" y1="204.0" x2="304.0" y2="204.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="20.0" y="222.0" font-size="11" text-anchor="start" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">Exact probability the signal is on</text>
<text x="20.0" y="244.0" font-size="13" text-anchor="start" fill="#23262d">After A+</text>
<text x="304.0" y="244.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">80%</text>
<text x="20.0" y="266.0" font-size="13" text-anchor="start" fill="#23262d">After A+ and B+</text>
<text x="304.0" y="266.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">80%</text>
<text x="20.0" y="294.0" font-size="12" text-anchor="start" fill="#5d626b">B adds a likelihood ratio of 1: odds stay 4:1</text>
<text x="336.0" y="30.0" font-size="15" text-anchor="start" fill="#23262d" font-weight="600">Independent sensors</text>
<text x="336.0" y="48.0" font-size="12" text-anchor="start" fill="#5d626b">Sensor B errs independently of A, given the signal</text>
<rect x="336.0" y="108.0" width="66.0" height="48.0" fill="#e8edf7" stroke="#02338a" stroke-width="1.2"/>
<text x="369.0" y="128.0" font-size="10.5" text-anchor="middle" fill="#02338a" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SIGNAL</text>
<text x="369.0" y="146.0" font-size="12" text-anchor="middle" fill="#23262d">on or off</text>
<rect x="420.0" y="74.0" width="88.0" height="48.0" fill="#fff" stroke="#23262d" stroke-width="1.6"/>
<text x="464.0" y="94.0" font-size="10.5" text-anchor="middle" fill="#23262d" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SENSOR A</text>
<text x="464.0" y="111.0" font-size="12" text-anchor="middle" fill="#5d626b">80% accurate</text>
<path d="M402 132.0 C411.0 132.0 411.0 98 418 98" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="420.0" y="152.0" width="88.0" height="48.0" fill="#fff" stroke="#23262d" stroke-width="1.6"/>
<text x="464.0" y="172.0" font-size="10.5" text-anchor="middle" fill="#23262d" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SENSOR B</text>
<text x="464.0" y="189.0" font-size="12" text-anchor="middle" fill="#5d626b">80% accurate</text>
<path d="M402 132.0 C411.0 132.0 411.0 176 418 176" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="540.0" y="74.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="580.0" y="93.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY A</text>
<text x="580.0" y="112.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M508 98 C524.0 98 524.0 98 538 98" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="540.0" y="152.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="580.0" y="171.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY B</text>
<text x="580.0" y="190.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M508 176 C524.0 176 524.0 176 538 176" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="336.0" y1="204.0" x2="620.0" y2="204.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="336.0" y="222.0" font-size="11" text-anchor="start" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">Exact probability the signal is on</text>
<text x="336.0" y="244.0" font-size="13" text-anchor="start" fill="#23262d">After A+</text>
<text x="620.0" y="244.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">80%</text>
<text x="336.0" y="266.0" font-size="13" text-anchor="start" fill="#23262d">After A+ and B+</text>
<text x="620.0" y="266.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">94.1% (16/17)</text>
<text x="336.0" y="294.0" font-size="12" text-anchor="start" fill="#5d626b">B multiplies the odds by 4 again: 4:1 becomes 16:1</text>
</svg>
