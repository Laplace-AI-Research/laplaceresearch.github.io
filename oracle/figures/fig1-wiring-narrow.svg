<text x="148.0" y="486.0" font-size="10.5" text-anchor="middle" fill="#23262d" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SENSOR B</text>
<text x="148.0" y="503.0" font-size="12" text-anchor="middle" fill="#5d626b">80% accurate</text>
<path d="M86 446.0 C95.0 446.0 95.0 490 102 490" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="300.0" y="388.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="340.0" y="407.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY A</text>
<text x="340.0" y="426.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M192 412 C246.0 412 246.0 412 298 412" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="300.0" y="466.0" width="80.0" height="48.0" fill="#fff" stroke="#8d9199" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="340.0" y="485.0" font-size="10.5" text-anchor="middle" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">DISPLAY B</text>
<text x="340.0" y="504.0" font-size="13" text-anchor="middle" fill="#02338a" font-weight="600">Positive</text>
<path d="M192 490 C246.0 490 246.0 490 298 490" fill="none" stroke="#23262d" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="20.0" y1="518.0" x2="380.0" y2="518.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="20.0" y="536.0" font-size="11" text-anchor="start" fill="#5d626b" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">Exact probability the signal is on</text>
<text x="20.0" y="558.0" font-size="13" text-anchor="start" fill="#23262d">After A+</text>
<text x="380.0" y="558.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">80%</text>
<text x="20.0" y="580.0" font-size="13" text-anchor="start" fill="#23262d">After A+ and B+</text>
<text x="380.0" y="580.0" font-size="15" text-anchor="end" fill="#02338a" font-weight="600">94.1% (16/17)</text>
<text x="20.0" y="608.0" font-size="12" text-anchor="start" fill="#5d626b">B multiplies the odds by 4 again: 4:1 becomes 16:1</text>
</svg>
