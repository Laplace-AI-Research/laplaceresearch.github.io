<text x="148.0" y="408.0" font-size="10.5" text-anchor="middle" fill="#23262d" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">SENSOR A</text>
<text x="148.0" y="425.0" font-size="12" text-anchor="middle" fill="#5d626b">80% accurate</text>
