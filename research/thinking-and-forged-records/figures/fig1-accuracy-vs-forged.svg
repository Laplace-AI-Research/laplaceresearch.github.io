<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" width="640" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#23262d">
<title id="t">Final-answer accuracy and forged-record resistance, thinking off and on</title><desc id="d">Two dot plots, one row per model. In every model, thinking-on raises final-answer accuracy and lowers forged-record resistance. Values: Qwen3-1.7B: accuracy 41.7% to 75.8%, forged-record resistance 35.7% to 15.4%; Qwen3-8B: accuracy 47.8% to 78.6%, forged-record resistance 17.4% to 9.1%; Qwen3.5-9B: accuracy 67.3% to 77.5%, forged-record resistance 16.2% to 12.4%; Granite-4.2-8B: accuracy 60.2% to 75.9%, forged-record resistance 17.4% to 9.1%.</desc>
<rect width="640" height="494" fill="#ffffff"/>
<circle cx="26" cy="20" r="6" fill="#fff" stroke="#6b7079" stroke-width="2.5"/>
<text x="40" y="25" font-size="13">Thinking off (greedy, 200-token cap)</text>
<circle cx="311.6" cy="20" r="6.5" fill="#3347d6"/>
<text x="325.6" y="25" font-size="13">Thinking on (sampled, 4,096-token cap)</text>
<text x="20" y="62" font-size="16" font-weight="600">Final-answer accuracy</text>
<text x="620" y="62" font-size="13" fill="#5d626b" text-anchor="end">higher is better</text>
<line x1="170.0" x2="170.0" y1="80" y2="230" stroke="#d9d6cf"/>
<text x="170.0" y="246" font-size="12" fill="#5d626b" text-anchor="middle">0%</text>
<line x1="277.5" x2="277.5" y1="80" y2="230" stroke="#d9d6cf"/>
<text x="277.5" y="246" font-size="12" fill="#5d626b" text-anchor="middle">25%</text>
<line x1="385.0" x2="385.0" y1="80" y2="230" stroke="#d9d6cf"/>
<text x="385.0" y="246" font-size="12" fill="#5d626b" text-anchor="middle">50%</text>
<line x1="492.5" x2="492.5" y1="80" y2="230" stroke="#d9d6cf"/>
<text x="492.5" y="246" font-size="12" fill="#5d626b" text-anchor="middle">75%</text>
<line x1="600.0" x2="600.0" y1="80" y2="230" stroke="#d9d6cf"/>
<text x="600.0" y="246" font-size="12" fill="#5d626b" text-anchor="middle">100%</text>
<text x="20" y="103" font-size="14">Qwen3-1.7B</text>
