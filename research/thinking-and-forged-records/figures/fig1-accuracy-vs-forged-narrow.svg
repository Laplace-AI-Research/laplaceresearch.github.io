<circle cx="26" cy="20" r="6" fill="#fff" stroke="#6b7079" stroke-width="2.5"/>
<text x="40" y="25" font-size="13">Thinking off (greedy, 200-token cap)</text>
<circle cx="26" cy="44" r="6.5" fill="#3347d6"/>
<text x="40" y="49" font-size="13">Thinking on (sampled, 4,096-token cap)</text>
<text x="20" y="86" font-size="16" font-weight="600">Final-answer accuracy</text>
<text x="380" y="86" font-size="13" fill="#5d626b" text-anchor="end">higher is better</text>
