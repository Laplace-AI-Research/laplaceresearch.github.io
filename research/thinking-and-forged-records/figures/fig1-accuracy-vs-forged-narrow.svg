<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 518" width="400" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#23262d">
<title id="t">Final-answer accuracy and forged-record resistance, thinking off and on</title><desc id="d">Two dot plots, one row per model. In every model, thinking-on raises final-answer accuracy and lowers forged-record resistance. Values: Qwen3-1.7B: accuracy 41.7% to 75.8%, forged-record resistance 35.7% to 15.4%; Qwen3-8B: accuracy 47.8% to 78.6%, forged-record resistance 17.4% to 9.1%; Qwen3.5-9B: accuracy 67.3% to 77.5%, forged-record resistance 16.2% to 12.4%; Granite-4.2-8B: accuracy 60.2% to 75.9%, forged-record resistance 17.4% to 9.1%.</desc>
