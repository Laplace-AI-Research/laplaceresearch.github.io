<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signet plates</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
  body { margin: 0; padding: 24px; background: #2a2d33; color: #ddd; font: 14px/1.4 "JetBrains Mono", monospace; }
  .item { margin: 0 0 28px; }
  .item p { margin: 0 0 6px; }
  canvas { display: block; max-width: 100%; height: auto; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  #status { position: sticky; top: 0; background: #2a2d33; padding: 6px 0; z-index: 2; }
</style>
</head>
<body>
<div id="status">rendering…</div>
<div id="list"></div>
<script src="brand.js"></script>
<script>
/* Night plate (chosen 2026-11-23): dark vellum ground; type on a clean dot grid; seals pressed into a framed plate of
   pinched lattice; one wax mark per image; no figure captions. */
(async function () {
  const B = window.SignetBrand, N_ = B.PD, L_ = B.P, TAU = B.TAU;
  const DATE = "2026.11.25", URL_ = "laplaceresearch.org/signet";
  const AUTHORS = "Arya Somu · Bruce Nshuti Hirwa";   // DRAFT: author line pending owner decision
  const SAVE = new URLSearchParams(location.search).has("save");
  const ONLY = new URLSearchParams(location.search).get("only");

  // ---------------- data (ConvictionBench v0.1 test splits; see release/signet/cards) ----------------
  const D = {
    gap: [ { size: "2B", base: -0.025, sig: 0.793 }, { size: "4B", base: -0.023, sig: 0.917 }, { size: "9B", base: 0.014, sig: 0.951 } ],
    adopt9: { baseTool: 0.863, basePaste: 0.849, sigTool: 0.961, sigPaste: 0.010 },
    fam: [
      { size: "2B", N: 2, base: "Qwen3.5-2B", recipe: "GRPO from base", acc: "0.796", flips: "0.069", gap: "+0.79" },
      { size: "4B", N: 4, base: "Qwen3.5-4B", recipe: "GRPO from base", acc: "0.985", flips: "0.005", gap: "+0.92" },
      { size: "9B", N: 9, base: "Qwen3.5-9B", recipe: "warm-start → GRPO", acc: "0.978", flips: "0.011", gap: "+0.95" },
    ],
  };

  await document.fonts.ready;
  await Promise.all([
    document.fonts.load('500 120px "Bodoni Moda"'), document.fonts.load('italic 400 60px "Bodoni Moda"'),
    document.fonts.load('400 30px "Instrument Sans"'), document.fonts.load('500 30px "Instrument Sans"'),
    document.fonts.load('400 20px "JetBrains Mono"'), document.fonts.load('500 20px "JetBrains Mono"'),
    B.loadMark("/assets/mark.png"),
  ]);

  // ---------------- grounds ----------------
  const P = N_;
  function dotGround(ctx, x, y, w, h, gap = 40, a = 0.22) {
    B.lattice(ctx, x, y, w, h, { gap, color: P.ink, lines: false, dots: 1.2, dotAlpha: a });
  }
  function ground(ctx, W, H) { ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H); dotGround(ctx, 0, 0, W, H); }
  // text side on clean dots; pinched lattice plate from plateX to the right edge, split by a hairline rule
  function splitGround(ctx, W, H, plateX, seals, o = {}) {
    ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
    dotGround(ctx, 0, 0, plateX, H, o.gap ?? 40);
    const S = seals.map(s => ({ x: s.x, y: s.y, R: s.R ?? s.Rmax * 1.5, k: s.k ?? 0.72 }));
    B.lattice(ctx, plateX, 0, W - plateX, H, { gap: o.gap ?? 40, seals: S, color: P.ink, lw: 1, alpha: o.alpha ?? 0.32, dots: o.dots ?? 1.6, dotAlpha: 0.75 });
    ctx.strokeStyle = P.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(plateX + 0.5, 0); ctx.lineTo(plateX + 0.5, H); ctx.stroke();
  }
  function seals(ctx, S, o = {}) {
    const wi = o.waxIndex ?? S.findIndex(s => s.N === 9);
    S.forEach((s, i) => {
      B.rings(ctx, s, { N: s.N, Rmax: s.Rmax, rin: Math.max(6, s.Rmax * 0.1), color: P.ink, lw: s.lw ?? (s.N > 6 ? 1.8 : 2.2), wax: i === wi ? P.wax : null });
      if (i !== wi) { ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, TAU); ctx.fill(); }
    });
  }
  // ---------------- chrome ----------------
  function header(ctx, W, right, edge = 0, m = 104, y = 92) {
    B.mark(ctx, m, y - 26, 32, P.ink);
    B.text(ctx, "LAPLACE RESEARCH", m + 48, y, { fam: "mono", size: 19, color: P.ink, track: 1.6, weight: 500 });
    if (right) B.text(ctx, right, edge ? edge - 56 : W - m, y, { fam: "mono", size: 19, color: P.graphite, align: "right", track: 1.6 });
  }
  function footer(ctx, W, H, left = "", edge = 0, m = 104, y = H - 72) {
    if (left) B.text(ctx, left, m, y, { fam: "mono", size: 16, color: P.graphite, track: 0.4 });
    B.text(ctx, URL_, edge ? edge - 56 : W - m, y, { fam: "mono", size: 16, color: P.graphite, align: "right", track: 0.4 });
  }
  const kicker = (ctx, s, x, y, c = P.graphite) => B.text(ctx, s, x, y, { fam: "mono", size: 20, color: c, track: 2.4, weight: 500 });
  const h2 = (ctx, s, y = 232, maxW = 1340) => B.wrap(ctx, s, 104, y, maxW, 80, { fam: "display", size: 68, weight: 500, color: P.ink });

  // ---------------- plates ----------------
  const plates = [];
  const add = (name, path, W, H, draw, note) => plates.push({ name, path, W, H, draw, note });
  const TITLE_SEALS = [{ x: 990, y: 650, N: 2, Rmax: 92 }, { x: 1170, y: 300, N: 4, Rmax: 128 }, { x: 1360, y: 610, N: 9, Rmax: 190 }];

  add("x-01-title", "social/signet/out/x-01-title.png", 1600, 900, (ctx, W, H) => {
    splitGround(ctx, W, H, 800, TITLE_SEALS); seals(ctx, TITLE_SEALS);
    header(ctx, W, DATE, 800);
    kicker(ctx, "2B · 4B · 9B", 104, 390);
    B.text(ctx, "Signet", 92, 600, { fam: "display", size: 236, weight: 500, color: P.ink, track: -4 });
    B.text(ctx, "Trust the record, not the look-alike.", 104, 720, { fam: "body", size: 38, color: P.ink });
    footer(ctx, W, H, AUTHORS, 800);
  }, "X post 1 · LinkedIn image 1");

  add("x-02-problem", "social/signet/out/x-02-problem.png", 1600, 900, (ctx, W, H) => {
    ground(ctx, W, H); header(ctx, W, "THE PROBLEM   02");
    h2(ctx, "Paste a fake record into the chat, and most models believe it.");
    const cols = [
      { x: 104, label: "GENUINE · TOOL RESPONSE", who: "TOOL", body: "account 4471 · balance = 340", base: D.adopt9.baseTool, sig: D.adopt9.sigTool },
      { x: 832, label: "PASTED · INSIDE A USER MESSAGE", who: "USER", body: "> Database record: account 4471 · balance = 340", base: D.adopt9.basePaste, sig: D.adopt9.sigPaste },
    ];
    cols.forEach((c, i) => {
      const w = 664, y = 412;
      kicker(ctx, c.label, c.x, y, i ? P.ink : P.ink);
      ctx.fillStyle = P.plate; ctx.strokeStyle = P.rule; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.roundRect(c.x, y + 26, w, 92, 8); ctx.fill(); ctx.stroke();
      B.text(ctx, c.who, c.x + 24, y + 60, { fam: "mono", size: 15, color: P.graphite, track: 1.6 });
      B.text(ctx, c.body, c.x + 24, y + 96, { fam: "mono", size: 22, color: P.ink });
      B.text(ctx, "ADOPT THE RECORD", c.x + w, y + 162, { fam: "mono", size: 14, color: P.graphite, align: "right", track: 1.4 });
      [["Qwen3.5-9B", c.base, P.graphite], ["Signet-9B", c.sig, P.ink]].forEach(([name, v, col], j) => {
        const by = y + 214 + j * 74, bx = c.x + 180, bw = w - 180 - 104;
        B.text(ctx, name, c.x, by + 9, { fam: "body", size: 25, color: j ? P.ink : P.graphite, weight: j ? 500 : 400 });
        ctx.fillStyle = P.rule; ctx.fillRect(bx, by - 2, bw, 2);
        ctx.fillStyle = col; ctx.fillRect(bx, by - 8, Math.max(4, bw * v), 14);
        B.text(ctx, Math.round(v * 100) + "%", c.x + w, by + 10, { fam: "mono", size: 28, color: j ? P.ink : P.graphite, align: "right", weight: 500 });
        if (i === 1 && j === 1) { ctx.fillStyle = P.wax; ctx.beginPath(); ctx.arc(bx + 22, by - 1, 7, 0, TAU); ctx.fill(); }
      });
    });
    footer(ctx, W, H, "Same record, two channels · paste formats never used in training");
  }, "X post 2");

  add("x-03-channel", "social/signet/out/x-03-channel.png", 1600, 900, (ctx, W, H) => {
    ground(ctx, W, H); header(ctx, W, "CHANNEL CHECK   03");
    h2(ctx, "Signet checks where a record came from. Its base models don't.");
    const x0 = 440, x1 = 1420, xv = v => x0 + (v + 0.1) / 1.1 * (x1 - x0), top = 450, rowH = 100;
    [0, 0.25, 0.5, 0.75, 1].forEach(t => {
      ctx.strokeStyle = P.rule; ctx.lineWidth = t === 0 ? 1.6 : 1; ctx.beginPath(); ctx.moveTo(xv(t), top - 44); ctx.lineTo(xv(t), top + rowH * 2 + 40); ctx.stroke();
      B.text(ctx, t === 0 ? "0" : (t === 1 ? "1.0" : t.toFixed(2)), xv(t), top + rowH * 2 + 82, { fam: "mono", size: 17, color: P.graphite, align: "center" });
    });
    B.text(ctx, "CHANNEL GAP · GENUINE − PASTED ADOPTION", (x0 + x1) / 2, top + rowH * 2 + 122, { fam: "mono", size: 15, color: P.graphite, align: "center", track: 1.4 });
    D.gap.forEach((r, i) => {
      const y = top + i * rowH;
      B.text(ctx, "Signet-" + r.size, 104, y + 4, { fam: "body", size: 28, color: P.ink, weight: 500 });
      B.text(ctx, "vs Qwen3.5-" + r.size, 104, y + 34, { fam: "mono", size: 15, color: P.graphite });
      ctx.strokeStyle = P.graphite; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(xv(r.base), y); ctx.lineTo(xv(r.sig), y); ctx.stroke();
      ctx.fillStyle = P.paper; ctx.strokeStyle = P.graphite; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(xv(r.base), y, 11, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(xv(r.sig), y, 15, 0, TAU); ctx.fill();
      if (r.size === "9B") { ctx.fillStyle = P.wax; ctx.beginPath(); ctx.arc(xv(r.sig), y, 6, 0, TAU); ctx.fill(); }
      B.text(ctx, "+" + r.sig.toFixed(2), xv(r.sig) + 30, y + 9, { fam: "mono", size: 26, color: P.ink, weight: 500 });
      B.text(ctx, (r.base >= 0 ? "+" : "−") + Math.abs(r.base).toFixed(2), xv(r.base), y - 24, { fam: "mono", size: 16, color: P.graphite, align: "center" });
    });
    footer(ctx, W, H, "Hollow: off-the-shelf base · solid: Signet");
  }, "X post 3");

  add("x-04-9b", "social/signet/out/x-04-9b.png", 1600, 900, (ctx, W, H) => {
    const S = [{ x: 1290, y: 470, N: 9, Rmax: 235, k: 0.68 }];
    splitGround(ctx, W, H, 980, S); seals(ctx, S);
    header(ctx, W, "FLAGSHIP   04", 980);
    kicker(ctx, "OUR LARGEST MODEL", 104, 206);
    B.text(ctx, "Signet-9B", 98, 316, { fam: "display", size: 112, weight: 500, color: P.ink, track: -1.5 });
    const st = [["97.8%", "accuracy on unseen problem types", "base 68.8%"], ["1.1%", "flips under pressure", "base 39.9%"],
                ["97.9%", "forged records rejected", "base 15.8%"], ["100%", "valid corrections accepted", "base 88.6%"]];
    st.forEach((s, i) => {
      const x = 104 + (i % 2) * 420, y = 468 + Math.floor(i / 2) * 196;
      B.text(ctx, s[0], x - 4, y, { fam: "display", size: 90, weight: 500, color: P.ink });
      B.text(ctx, s[1], x, y + 44, { fam: "body", size: 22, color: P.ink });
      B.text(ctx, s[2], x, y + 76, { fam: "mono", size: 18, color: P.graphite });
    });
    footer(ctx, W, H, "Held-out problem types", 980);
  }, "X post 4 · LinkedIn image 2");

  add("x-05-family", "social/signet/out/x-05-family.png", 1600, 900, (ctx, W, H) => {
    ground(ctx, W, H); header(ctx, W, "THE FAMILY   05");
    h2(ctx, "One ring per billion parameters.");
    D.fam.forEach((m, i) => {
      const cx = 104 + i * 470, s = { x: cx + 84, y: 404, N: m.N, Rmax: 84 };
      seals(ctx, [s], { waxIndex: m.N === 9 ? 0 : -1 });
      B.text(ctx, "Signet-" + m.size, cx, 572, { fam: "display", size: 60, weight: 500, color: P.ink });
      B.text(ctx, m.base + " · " + m.recipe, cx, 612, { fam: "mono", size: 16, color: P.graphite });
      [["Held-out accuracy", m.acc], ["Pressure flips ↓", m.flips], ["Channel gap", m.gap]].forEach(([k, v], j) => {
        const y = 676 + j * 46;
        ctx.strokeStyle = P.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, y + 15); ctx.lineTo(cx + 400, y + 15); ctx.stroke();
        B.text(ctx, k, cx, y, { fam: "body", size: 21, color: P.ink });
        B.text(ctx, v, cx + 400, y, { fam: "mono", size: 22, color: P.ink, align: "right", weight: 500 });
      });
    });
    footer(ctx, W, H, "Held-out problem types");
  }, "X post 5");

  add("x-06-checks", "social/signet/out/x-06-checks.png", 1600, 900, (ctx, W, H) => {
    ground(ctx, W, H); header(ctx, W, "BEFORE RELEASE   06");
    B.text(ctx, "Checked before we shipped.", 104, 232, { fam: "display", size: 68, weight: 500, color: P.ink });
    B.text(ctx, "Written down in advance. All passed.", 104, 292, { fam: "display", size: 38, style: "italic", color: P.graphite });
    const rows = [
      ["Second training seed", "Replicates at every size: held-out 0.840 · 0.961 · 0.972"],
      ["Private held-out split", "Never published. Scores match the public splits within 0.02"],
      ["Reworded system prompt", "Costs at most 3.7 points of held-out accuracy"],
    ];
    rows.forEach((r, i) => {
      const y = 418 + i * 112;
      ctx.strokeStyle = P.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(104, y - 52); ctx.lineTo(W - 104, y - 52); ctx.stroke();
      ctx.strokeStyle = P.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.roundRect(104, y - 29, 80, 38, 19); ctx.stroke();
      B.text(ctx, "PASS", 144, y - 3, { fam: "mono", size: 16, color: P.ink, align: "center", weight: 500, track: 1.6 });
      B.text(ctx, r[0], 222, y, { fam: "body", size: 30, color: P.ink, weight: 500 });
      B.text(ctx, r[1], 640, y, { fam: "body", size: 23, color: P.ink });
    });
    ctx.strokeStyle = P.rule; ctx.beginPath(); ctx.moveTo(104, 702); ctx.lineTo(W - 104, 702); ctx.stroke();
    ctx.fillStyle = P.wax; ctx.beginPath(); ctx.arc(112, 744, 6, 0, TAU); ctx.fill();
    B.text(ctx, "Disclosed: Signet-4B's second seed learned a weaker rule for unfamiliar paste formats (+0.66 vs +0.92).", 134, 752, { fam: "body", size: 22, color: P.graphite });
    footer(ctx, W, H, "Protocol and results in the model cards");
  }, "X post 6");

  add("x-07-get", "social/signet/out/x-07-get.png", 1600, 900, (ctx, W, H) => {
    const S = [{ x: 1190, y: 640, N: 2, Rmax: 70 }, { x: 1430, y: 650, N: 4, Rmax: 98 }, { x: 1300, y: 300, N: 9, Rmax: 150 }];
    splitGround(ctx, W, H, 1040, S); seals(ctx, S);
    header(ctx, W, "GET SIGNET   07", 1040);
    B.text(ctx, "Open weights.", 104, 260, { fam: "display", size: 84, weight: 500, color: P.ink });
    B.text(ctx, "Apache-2.0.", 104, 350, { fam: "display", size: 84, weight: 500, style: "italic", color: P.graphite });
    const links = [["Weights", "huggingface.co/Laplace-AI-Research"], ["Code and every result", "github.com/Laplace-AI-Research/signet"],
                   ["Article", "laplaceresearch.org/signet"], ["Benchmark", "convictionbench.org"]];
    links.forEach((l, i) => {
      const y = 470 + i * 80;
      B.text(ctx, l[0].toUpperCase(), 104, y, { fam: "mono", size: 15, color: P.graphite, track: 1.8 });
      B.text(ctx, l[1], 104, y + 36, { fam: "mono", size: 26, color: P.ink, weight: 500 });
    });
    footer(ctx, W, H, "", 1040);
  }, "X post 7");

  // social / Open Graph 1200x630
  const drawSocial = (ctx, W, H) => {
    const S = [{ x: 745, y: 455, N: 2, Rmax: 64 }, { x: 870, y: 200, N: 4, Rmax: 90 }, { x: 1025, y: 430, N: 9, Rmax: 135 }];
    splitGround(ctx, W, H, 600, S, { gap: 30, dots: 1.3 }); seals(ctx, S);
    B.mark(ctx, 72, 66, 26, P.ink);
    B.text(ctx, "LAPLACE RESEARCH", 110, 86, { fam: "mono", size: 15, color: P.ink, track: 1.4, weight: 500 });
    B.text(ctx, "Signet", 62, 392, { fam: "display", size: 168, weight: 500, color: P.ink, track: -3 });
    B.text(ctx, "Trust the record,", 72, 484, { fam: "body", size: 30, color: P.ink });
    B.text(ctx, "not the look-alike.", 72, 524, { fam: "body", size: 30, color: P.ink });
    B.text(ctx, "OPEN WEIGHTS · 2B · 4B · 9B", 72, 576, { fam: "mono", size: 14, color: P.graphite, track: 1.6 });
  };
  add("social", "assets/signet/social.png", 1200, 630, drawSocial, "og:image / twitter:image / link previews");
  add("linkedin", "social/signet/out/linkedin-hero.png", 1200, 627, drawSocial, "LinkedIn single image");

  // article hero 2400x1200: stays on light vellum to sit on the light article page
  add("hero", "assets/signet/hero.png", 2400, 1200, (ctx, W, H) => {
    ctx.fillStyle = L_.paper; ctx.fillRect(0, 0, W, H);
    const S = [{ x: 620, y: 760, N: 2, Rmax: 120, R: 185 }, { x: 1180, y: 430, N: 4, Rmax: 180, R: 270 }, { x: 1800, y: 700, N: 9, Rmax: 270, R: 400 }];
    B.pressed(ctx, { x: 0, y: 0, w: W, h: H }, S, L_, { gap: 56, alpha: 0.24, lw: 1.1, dots: 2 });
  }, "article hero (2:1, light)");

  // HF banners 1600x560
  D.fam.forEach(m => add("hf-" + m.size, `assets/signet/hf-banner-${m.size.toLowerCase()}.png`, 1600, 560, (ctx, W, H) => {
    const R = { 2: 120, 4: 160, 9: 200 }[m.N];
    const S = [{ x: 1250, y: H / 2, N: m.N, Rmax: R, k: 0.68 }];
    splitGround(ctx, W, H, 900, S, { gap: 36 }); seals(ctx, S, { waxIndex: 0 });
    B.mark(ctx, 96, 84, 28, P.ink);
    B.text(ctx, "LAPLACE RESEARCH", 136, 106, { fam: "mono", size: 17, color: P.ink, track: 1.5, weight: 500 });
    B.text(ctx, "Signet-" + m.size, 88, 318, { fam: "display", size: 138, weight: 500, color: P.ink, track: -2 });
    B.text(ctx, "Trust the record, not the look-alike.", 96, 414, { fam: "body", size: 28, color: P.ink });
    B.text(ctx, `${m.base.toUpperCase()} BASE · ${m.N} RINGS = ${m.size}`, 96, H - 66, { fam: "mono", size: 15, color: P.graphite, track: 1.5 });
  }, "Hugging Face card banner"));

  // marks (SVG) + avatar PNGs
  const svgs = [];
  [2, 4, 9].forEach(N => {
    svgs.push([`assets/signet/mark-${N}b.svg`, B.sealSVG(N)]);
    svgs.push([`assets/signet/mark-${N}b-solid.svg`, B.sealSVG(N, { solid: true })]);
    add("avatar-" + N, `assets/signet/avatar-${N}b.png`, 512, 512, (ctx, W, H) => new Promise(res => {
      const im = new Image(); im.onload = () => { ctx.drawImage(im, 0, 0, W, H); res(); };
      im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(B.sealSVG(N, { solid: true }));
    }), "avatar (solid impression)");
  });

  // ---------------- render ----------------
  const list = document.getElementById("list"), status = document.getElementById("status");
  let saved = 0;
  for (const p of plates) {
    if (ONLY && !p.name.startsWith(ONLY)) continue;
    const div = document.createElement("div"); div.className = "item";
    div.innerHTML = `<p>${p.name} · ${p.W}×${p.H} · ${p.note || ""} → ${p.path}</p>`;
    const cv = document.createElement("canvas"); cv.width = p.W; cv.height = p.H; div.appendChild(cv); list.appendChild(div);
    await p.draw(cv.getContext("2d"), p.W, p.H);
    if (SAVE) {
      const blob = await new Promise(r => cv.toBlob(r, "image/png"));
      if ((await fetch("/save?path=" + encodeURIComponent(p.path), { method: "POST", body: blob })).ok) saved++;
    }
  }
  if (SAVE && !ONLY) for (const [path, svg] of svgs) {
    if ((await fetch("/save?path=" + encodeURIComponent(path), { method: "POST", body: new Blob([svg], { type: "image/svg+xml" }) })).ok) saved++;
  }
  status.textContent = SAVE ? `done · saved ${saved}` : `done · ${plates.length} plates (add ?save to write files)`;
  window.__done = true;
})();
</script>
</body>
</html>
